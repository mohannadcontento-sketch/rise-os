<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#1B342B"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2F5F7"/>
      <stop offset="100%" stop-color="#CDD3C6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#D6FF3D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#D6FF3D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Obsidian-to-forest rounded canvas (matches app identity) -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>

  <!-- Zenith glow + sun resting exactly on the apex ("الشمس في أوجها") -->
  <circle cx="96" cy="58" r="36" fill="url(#halo)"/>
  <circle cx="96" cy="58" r="15" fill="#D6FF3D"/>

  <!-- The apex peak -->
  <path d="M96 74 L138 140 Q141 146 134 146 L58 146 Q51 146 54 140 Z" fill="url(#peak)"/>

  <!-- Horizon lines (depth cue, echoes the app's calm baseline language) -->
  <rect x="38" y="156" width="116" height="2" rx="1" fill="#2A4A3E"/>
  <rect x="62" y="164" width="68" height="1.6" rx="0.8" fill="#2A4A3E" opacity="0.7"/>
</svg>
